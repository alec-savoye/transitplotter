# Everything runs in Docker. Nothing is installed on the host.
#
#   docker compose build
#   docker compose run --rm build-static     # download+cache gtfs_static.sqlite
#   docker compose up server web              # run the app
#
# Large cached assets (the GTFS SQLite) live OFF the repo, bind-mounted from
# GTFS_CACHE_HOST into /cache. Only source/config lives under the repo.
#
# Set GTFS_CACHE_HOST in a local .env (see .env.example) to the host directory
# where you want persistent data (the SQLite DB, JSON stores, and the
# container's node_modules) stored. Defaults to ./.cache under the repo.

x-cache-env: &cache-env
  GTFS_CACHE_DIR: /cache

x-cache-volume: &cache-volume
  type: bind
  source: ${GTFS_CACHE_HOST:-./.cache}
  target: /cache

# node_modules also live under GTFS_CACHE_HOST, bind-mounted from the data
# folder. These shadow the host repo's (gitignored) node_modules so the
# container keeps its own installed, container-arch-built deps. They must be
# populated with `docker compose run --rm server npm install` after a fresh
# checkout or a dependency change. See MAINTENANCE.md §12.
x-nm-root: &nm-root
  type: bind
  source: ${GTFS_CACHE_HOST:-./.cache}/node_modules/root
  target: /app/node_modules
x-nm-shared: &nm-shared
  type: bind
  source: ${GTFS_CACHE_HOST:-./.cache}/node_modules/shared
  target: /app/shared/node_modules
x-nm-server: &nm-server
  type: bind
  source: ${GTFS_CACHE_HOST:-./.cache}/node_modules/server
  target: /app/server/node_modules
x-nm-web: &nm-web
  type: bind
  source: ${GTFS_CACHE_HOST:-./.cache}/node_modules/web
  target: /app/web/node_modules

services:
  # Backend: polls MTA feeds, computes positions, serves WS + /routes.
  server:
    build: .
    command: npm run dev:server
    # Auto-start on Docker daemon startup and recover from crashes.
    restart: unless-stopped
    ports:
      # host 8090 -> container 8080. Change the host side if 8090 is taken.
      - "8090:8080"
    environment:
      <<: *cache-env
      PORT: 8080
      # MTA Bus Time developer API key (free from register.developer.obanyc.com).
      BUS_API_KEY: ${BUS_API_KEY:-}
    volumes:
      - ./:/app
      - *nm-root
      - *nm-shared
      - *nm-server
      - *nm-web
      - *cache-volume

  # Frontend: Vite dev server (dumb renderer).
  web:
    build: .
    command: npm run dev:web
    # Auto-start on Docker daemon startup and recover from crashes.
    restart: unless-stopped
    ports:
      - "5173:5173"
    # No VITE_SERVER_* here: the web app derives the backend host from the
    # browser's location hostname (see web/src/config.ts), so LAN clients hit
    # the machine's IP instead of their own localhost. Set these only to pin a
    # specific backend host when merging into another deployment.
    #
    # VITE_ALLOWED_HOSTS: comma-separated public hostname(s) the dev server is
    # reverse-proxied under. Unset -> Vite allows all hosts (see vite.config.ts).
    environment:
      VITE_ALLOWED_HOSTS: ${VITE_ALLOWED_HOSTS:-}
    volumes:
      - ./:/app
      - *nm-root
      - *nm-shared
      - *nm-server
      - *nm-web

  # One-shot: download the MTA static ZIP and cache it as SQLite off-boot.
  # Behind a profile so it does NOT run on `docker compose up`; invoke with:
  #   docker compose run --rm build-static
  build-static:
    build: .
    profiles: ["tools"]
    command: npm run build-static
    environment:
      <<: *cache-env
    volumes:
      - ./:/app
      - *nm-root
      - *cache-volume
