<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>TransitPlotter</title>
    <style>
      html, body, #map { margin: 0; height: 100%; width: 100%; }
      body { background: #1a1a1a; font-family: system-ui, sans-serif; }

      #hud {
        position: absolute; top: 10px; left: 10px; z-index: 10;
        background: rgba(0,0,0,0.7); color: #fff; padding: 8px 11px;
        border-radius: 8px; font-size: 12px; line-height: 1.35;
        min-width: 150px; box-shadow: 0 1px 6px rgba(0,0,0,0.35);
      }
      .hud-status { font-weight: 700; font-size: 13px; margin-bottom: 3px; }
      .hud-status.live { color: #4ade80; }
      .hud-status.connecting { color: #fbbf24; }
      .hud-status.down { color: #f87171; }
      .hud-line { font-size: 13px; }
      .hud-line b { font-size: 15px; }
      .hud-modes {
        display: flex; gap: 10px; margin: 4px 0 2px; font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      .hud-sub { color: #cbd5e1; font-size: 11px; }

      /* Stacked control panel (top-left, under the HUD) */
      #controls {
        position: absolute; top: 148px; left: 10px; z-index: 10;
        display: flex; flex-direction: column; gap: 6px; align-items: flex-start;
        max-width: 190px;
      }
      /* Shared toggle-button style (matches the original look). */
      .ctl-btn {
        background: rgba(0,0,0,0.65); color: #fff; border: 1px solid rgba(255,255,255,0.25);
        padding: 6px 10px; border-radius: 6px; font-size: 13px; font-weight: 600;
        cursor: pointer; font-family: inherit; text-align: left; width: 100%;
        box-sizing: border-box;
      }
      .ctl-btn:hover { background: rgba(0,0,0,0.8); }

      #hotspots-toggle.active {
        background: rgba(200,0,0,0.85); border-color: #ff6b6b;
        box-shadow: 0 0 10px rgba(255,40,40,0.6);
      }
      #ferries-toggle.active {
        background: rgba(10,61,98,0.9); border-color: #4aa3df;
      }
      #trackrecords-toggle.active {
        background: rgba(20,120,60,0.9); border-color: #6ee7a0;
        box-shadow: 0 0 10px rgba(46,204,64,0.5);
      }

      /* Buses group */
      #bus-group {
        background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.2);
        border-radius: 6px; padding: 6px; width: 100%; box-sizing: border-box;
      }
      #bus-group .bg-title {
        font-size: 13px; font-weight: 700; color: #fff; margin-bottom: 5px;
      }
      .bus-boro {
        display: block; width: 100%; box-sizing: border-box; text-align: left;
        background: rgba(255,255,255,0.08); color: #cfe6ff;
        border: 1px solid rgba(255,255,255,0.15); border-radius: 5px;
        padding: 4px 8px; margin-bottom: 4px; font-size: 12px; font-weight: 600;
        cursor: pointer; font-family: inherit;
      }
      .bus-boro:hover { background: rgba(255,255,255,0.16); }
      .bus-boro.active {
        background: rgba(27,127,196,0.9); color: #fff; border-color: #7cc4f2;
      }
      .bus-zoom { margin-top: 4px; color: #fff; font-size: 11px; }
      .bus-zoom label { display: block; margin-bottom: 2px; opacity: 0.85; }
      .bus-zoom input[type="range"] { width: 100%; }

      /* Mobile: smaller, tighter controls so they don't dominate the screen. */
      @media (max-width: 640px), (pointer: coarse) {
        #controls {
          top: 132px; left: 6px; gap: 4px; max-width: 132px;
        }
        .ctl-btn {
          padding: 4px 7px; font-size: 11px; border-radius: 5px;
        }
        #bus-group { padding: 4px; }
        #bus-group .bg-title { font-size: 11px; margin-bottom: 3px; }
        .bus-boro { padding: 3px 6px; font-size: 10px; margin-bottom: 3px; }
        .bus-zoom { font-size: 10px; }
        #legend { max-width: 150px; padding: 6px 7px; font-size: 11px; }
        #legend .lg-bullet { width: 17px; height: 17px; font-size: 10px; }
      }

      .tp-ferry {
        display: inline-flex; align-items: center; justify-content: center;
        width: 26px; height: 26px; border-radius: 6px; font-size: 15px; flex: none;
      }
      .tp-busbadge {
        display: inline-flex; align-items: center; justify-content: center;
        min-width: 34px; height: 20px; padding: 0 6px; border-radius: 6px;
        font-size: 12px; font-weight: 700; flex: none;
      }

      /* Line legend */
      #legend {
        position: absolute; bottom: 28px; left: 10px; z-index: 10;
        background: rgba(255,255,255,0.92); color: #111; padding: 8px 10px;
        border-radius: 8px; font-size: 12px; max-width: 220px;
        box-shadow: 0 1px 6px rgba(0,0,0,0.3);
      }
      #legend h4 { margin: 0 0 6px; font-size: 12px; }
      #legend .rows { display: flex; flex-wrap: wrap; gap: 4px; }
      .lg-bullet {
        display: inline-flex; align-items: center; justify-content: center;
        width: 20px; height: 20px; border-radius: 50%; color: #fff;
        font-weight: 700; font-size: 11px;
      }
      .lg-bullet.exp { border-radius: 3px; transform: rotate(45deg); }
      .lg-bullet.exp span { transform: rotate(-45deg); }

      /* Train info popup */
      .maplibregl-popup-content {
        font-family: system-ui, sans-serif; padding: 10px 12px;
        border-radius: 8px;
      }
      .tp-pop-head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
      .tp-bullet {
        display: inline-flex; align-items: center; justify-content: center;
        width: 26px; height: 26px; border-radius: 50%; color: #fff;
        font-weight: 700; font-size: 14px; flex: none;
      }
      .tp-bullet.exp { border-radius: 4px; transform: rotate(45deg); }
      .tp-bullet.exp span { transform: rotate(-45deg); }
      .tp-dest { font-weight: 600; font-size: 14px; }
      .tp-row { font-size: 13px; margin-top: 2px; }
      .tp-eta { font-weight: 700; }
      .tp-status { font-size: 12px; margin-top: 4px; }
      .tp-status.stalled { color: #c0392b; font-weight: 700; }
      .tp-status.moving { color: #148f4b; }
      .tp-status.stopped { color: #b8860b; }
      .tp-delay { color: #c0392b; }
      .tp-sub { color: #888; font-size: 11px; margin-top: 3px; }
      .tp-mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }

      /* Hotspot summary popup */
      .hs-head { font-weight: 800; color: #c0392b; margin-bottom: 4px; font-size: 14px; }
      .hs-stats { font-size: 12px; line-height: 1.4; margin-bottom: 8px; }
      .hs-rows { max-height: 220px; overflow-y: auto; }
      .hs-row { display: flex; align-items: center; gap: 8px; padding: 4px 0; border-top: 1px solid #eee; }
      .hs-row-txt { font-size: 12px; line-height: 1.3; }
      .hs-sub { color: #c0392b; font-weight: 600; }
      .hs-stalled { color: #fff; background: #c0392b; border-radius: 3px; padding: 0 4px; font-size: 10px; }
      .hs-more { font-size: 12px; color: #777; padding-top: 6px; }
      .hs-bullet {
        display: inline-flex; align-items: center; justify-content: center;
        width: 24px; height: 24px; border-radius: 50%; font-weight: 700;
        font-size: 12px; flex: none;
      }
      .hs-bullet.exp { border-radius: 4px; transform: rotate(45deg); }
      .hs-bullet.exp span { transform: rotate(-45deg); }

      /* Track-record cell rationale popup */
      .tr-head {
        font-weight: 800; font-size: 14px; margin-bottom: 6px; padding-left: 8px;
        border-left: 4px solid #888; display: flex; align-items: center; gap: 6px;
      }
      .tr-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
      .tr-stats { font-size: 12px; line-height: 1.4; margin-bottom: 8px; }
      .tr-rows { }
      .tr-row { display: flex; justify-content: space-between; gap: 10px; padding: 4px 0; border-top: 1px solid #eee; font-size: 12px; }
      .tr-mode { font-weight: 700; flex: none; }
      .tr-nums { text-align: right; }
      .tr-sub { color: #777; font-weight: 400; }
      .tr-foot { font-size: 11px; color: #888; margin-top: 8px; font-style: italic; }

      /* Track-record historical %-lateness-vs-date plot */
      .tr-plot { margin: 8px 0; min-height: 40px; }
      .tr-plot-title { font-size: 11px; font-weight: 700; color: #555; margin-bottom: 2px; }
      .tr-plot-loading, .tr-plot-empty { font-size: 11px; color: #999; padding: 8px 0; }
      .tr-svg { display: block; background: #fafafa; border-radius: 4px; }
      .tr-grid { stroke: #e2e2e2; stroke-width: 0.5; }
      .tr-ylab { fill: #999; font-size: 7px; text-anchor: end; }
      .tr-xlab { fill: #999; font-size: 7px; }
      .tr-line { fill: none; stroke: #c0392b; stroke-width: 1.6; stroke-linejoin: round; }
      .tr-dot-pt { fill: #c0392b; }

      /* "Collecting data" modal for track records */
      #tr-modal {
        position: absolute; inset: 0; z-index: 40; display: none;
        align-items: center; justify-content: center;
        background: rgba(0,0,0,0.5);
      }
      #tr-modal.show { display: flex; }
      #tr-modal .tr-card {
        background: #fff; color: #111; border-radius: 12px; padding: 20px 22px;
        max-width: 340px; width: 85%; box-shadow: 0 6px 30px rgba(0,0,0,0.5);
        font-family: system-ui, sans-serif;
      }
      #tr-modal h3 { margin: 0 0 8px; font-size: 17px; }
      #tr-modal .tr-prog { font-size: 13px; line-height: 1.5; margin-bottom: 10px; }
      #tr-modal .tr-bar {
        height: 8px; border-radius: 4px; background: #e6e6e6; overflow: hidden; margin: 8px 0 12px;
      }
      #tr-modal .tr-bar > span { display: block; height: 100%; background: #2ecc40; }
      #tr-modal .tr-break { font-size: 12px; color: #444; line-height: 1.5; }
      #tr-modal .tr-close {
        margin-top: 14px; width: 100%; padding: 8px; border: none; border-radius: 6px;
        background: #147a3c; color: #fff; font-weight: 700; font-size: 13px; cursor: pointer;
      }

      /* Station arrivals panel */
      #station-panel {
        position: absolute; top: 0; right: 0; z-index: 20;
        width: 320px; max-width: 85vw; height: 100%;
        background: #fff; color: #111; box-shadow: -2px 0 12px rgba(0,0,0,0.25);
        overflow-y: auto; font-size: 14px;
      }
      .st-head {
        display: flex; justify-content: space-between; align-items: center;
        padding: 12px 14px; background: #0b60d6; color: #fff;
        position: sticky; top: 0; font-size: 16px;
      }
      .st-close { cursor: pointer; font-size: 18px; opacity: 0.9; }
      .st-close:hover { opacity: 1; }
      .st-dir { padding: 8px 14px; }
      .st-dir h4 {
        margin: 8px 0 6px; font-size: 12px; text-transform: uppercase;
        letter-spacing: 0.05em; color: #666;
      }
      .st-row {
        display: flex; align-items: center; gap: 8px; padding: 6px 0;
        border-bottom: 1px solid #eee;
      }
      .st-bullet {
        display: inline-flex; align-items: center; justify-content: center;
        width: 26px; height: 26px; border-radius: 50%; font-weight: 700;
        font-size: 13px; flex: none;
      }
      .st-bullet.exp { border-radius: 4px; transform: rotate(45deg); }
      .st-bullet.exp span { transform: rotate(-45deg); }
      .st-dest { flex: 1; font-size: 13px; }
      .st-exp { color: #b8860b; font-style: normal; font-size: 11px; }
      .st-eta { font-weight: 700; font-variant-numeric: tabular-nums; }
      .st-empty, .st-loading { color: #888; padding: 8px 0; font-size: 13px; }
      .st-alerts { padding: 8px 14px; background: #fff8e6; }
      .st-alerts h4 {
        margin: 4px 0 6px; font-size: 12px; text-transform: uppercase;
        letter-spacing: 0.05em; color: #8a6d00;
      }
      .st-alert {
        font-size: 12px; line-height: 1.35; padding: 6px 8px; margin-bottom: 6px;
        border-radius: 6px; background: #fff; border-left: 4px solid #e8a400;
      }
      .st-alert.sev-3 { border-left-color: #c0392b; }
      .st-alert.sev-2 { border-left-color: #e8730c; }

      /* Trip planner (bottom-right) — hidden until toggled from the controls. */
      #planner {
        position: absolute; bottom: 28px; right: 10px; z-index: 15;
        width: 300px; max-width: 88vw; background: #fff; color: #111;
        border-radius: 10px; box-shadow: 0 2px 12px rgba(0,0,0,0.3);
        padding: 10px; font-size: 13px;
      }
      #planner.hidden { display: none; }
      #planner-toggle.active {
        background: rgba(11,96,214,0.9); border-color: #7cc4f2;
      }
      #planner .pl-head { font-weight: 700; margin-bottom: 8px; }
      #planner input {
        width: 100%; box-sizing: border-box; margin-bottom: 6px; padding: 7px 8px;
        border: 1px solid #ccc; border-radius: 6px; font-size: 13px;
      }
      #pl-go {
        width: 100%; padding: 8px; border: 0; border-radius: 6px;
        background: #0b60d6; color: #fff; font-weight: 700; cursor: pointer;
      }
      #pl-go:hover { background: #094ea8; }
      #pl-result { margin-top: 10px; }
      .pl-summary { font-size: 15px; margin-bottom: 8px; }
      .pl-loading, .pl-err { color: #888; padding: 6px 0; }
      .pl-err { color: #c0392b; }
      .pl-leg { display: flex; align-items: center; gap: 8px; }
      .pl-leg-txt { font-size: 13px; line-height: 1.3; }
      .pl-sub { color: #777; font-size: 12px; }
      .pl-arrow { color: #bbb; margin: 2px 0 2px 11px; font-size: 12px; }
      .pl-walk {
        display: inline-flex; align-items: center; justify-content: center;
        width: 26px; height: 26px; flex: none; font-size: 16px;
      }
      .pl-bullet {
        display: inline-flex; align-items: center; justify-content: center;
        width: 26px; height: 26px; border-radius: 50%; font-weight: 700;
        font-size: 13px; flex: none;
      }
      .pl-bullet.exp { border-radius: 4px; transform: rotate(45deg); }
      .pl-bullet.exp span { transform: rotate(-45deg); }

      /* Line-status strip (top center) */
      #status-strip {
        position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
        z-index: 15; display: flex; align-items: center; gap: 8px;
        background: rgba(255,255,255,0.94); color: #111; padding: 5px 10px;
        border-radius: 20px; box-shadow: 0 1px 6px rgba(0,0,0,0.3);
        cursor: pointer; max-width: 90vw; overflow: hidden; font-size: 12px;
      }
      #status-strip .ss-title { font-weight: 700; white-space: nowrap; }
      #status-strip .ss-bullets { display: flex; gap: 3px; overflow: hidden; }
      .ss-bullet {
        position: relative; display: inline-flex; align-items: center;
        justify-content: center; width: 20px; height: 20px; border-radius: 50%;
        font-weight: 700; font-size: 11px; flex: none;
      }
      .ss-badge {
        position: absolute; top: -2px; right: -2px; width: 8px; height: 8px;
        border-radius: 50%; border: 1.5px solid #fff;
      }

      /* Alerts drawer */
      #alerts-drawer {
        position: absolute; top: 44px; left: 50%; transform: translateX(-50%);
        z-index: 16; width: 380px; max-width: 92vw; max-height: 70vh;
        overflow-y: auto; background: #fff; color: #111; border-radius: 10px;
        box-shadow: 0 4px 16px rgba(0,0,0,0.3);
      }
      .al-head {
        display: flex; justify-content: space-between; align-items: center;
        padding: 10px 14px; background: #222; color: #fff;
        position: sticky; top: 0; font-size: 15px;
      }
      .al-close { cursor: pointer; }
      .al-item { padding: 10px 14px; border-bottom: 1px solid #eee; border-left: 4px solid #ccc; }
      .al-item.sev-3 { border-left-color: #c0392b; }
      .al-item.sev-2 { border-left-color: #e8730c; }
      .al-item.sev-1 { border-left-color: #e8a400; }
      .al-item-head { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
      .al-chip {
        display: inline-flex; align-items: center; justify-content: center;
        min-width: 18px; height: 18px; padding: 0 4px; border-radius: 9px;
        background: #444; color: #fff; font-weight: 700; font-size: 11px;
      }
      .al-effect { font-weight: 700; font-size: 12px; color: #555; }
      .al-header { font-size: 13px; line-height: 1.35; }
      .al-empty { padding: 16px; color: #888; }
      .al-bus { border-top: 1px solid #ddd; }
      .al-bus > summary {
        cursor: pointer; padding: 10px 14px; font-weight: 700; font-size: 13px;
        color: #1b7fc4; background: #f4f9fd; user-select: none;
      }
      .al-bus > summary:hover { background: #e9f3fb; }
      .al-bus[open] > summary { border-bottom: 1px solid #eee; }

      /* Attribution / disclaimer footer */
      #disclaimer {
        position: absolute; bottom: 0; right: 0; z-index: 10;
        background: rgba(255,255,255,0.8); color: #333; font-size: 10px;
        padding: 2px 6px; border-top-left-radius: 6px; max-width: 60%;
        text-align: right;
      }
      #disclaimer a { color: #0b60d6; }

      /* Hidden admin overlay (quadruple-click the map) */
      #admin-overlay {
        position: absolute; inset: 0; z-index: 50; display: none;
        align-items: center; justify-content: center;
        background: rgba(0,0,0,0.6);
      }
      #admin-overlay.show { display: flex; }
      #admin-overlay .admin-card {
        background: #14181d; color: #e8edf2; border-radius: 12px;
        width: 92%; max-width: 620px; max-height: 88vh; overflow-y: auto;
        padding: 18px 20px; box-shadow: 0 8px 40px rgba(0,0,0,0.6);
        font-family: system-ui, sans-serif;
      }
      .admin-head { display: flex; align-items: center; justify-content: space-between; }
      .admin-head h2 { margin: 0; font-size: 18px; }
      .admin-close {
        background: none; border: none; color: #9aa4af;
        font-size: 18px; cursor: pointer; line-height: 1;
      }
      .admin-gate { padding: 24px 0; }
      .admin-auth-form { display: flex; flex-direction: column; gap: 8px; max-width: 260px; }
      .admin-auth-form label { font-size: 12px; color: #9aa4af; }
      .admin-auth-form input {
        background: #0c1013; border: 1px solid #2a323b; border-radius: 6px;
        color: #fff; padding: 8px 10px; font-size: 14px;
      }
      .admin-auth-form button {
        background: #0b60d6; color: #fff; border: none; border-radius: 6px;
        padding: 8px 12px; font-weight: 700; cursor: pointer; font-size: 13px;
      }
      .admin-auth-error { color: #ff6b6b; font-size: 12px; min-height: 14px; }
      .admin-content.hidden { display: none; }
      .admin-total { font-size: 14px; font-weight: 700; margin: 8px 0; }
      .admin-section-title {
        font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em;
        color: #7d8894; margin: 16px 0 6px; border-top: 1px solid #232a31; padding-top: 10px;
      }
      .admin-chart-bars {
        display: flex; align-items: flex-end; gap: 2px; height: 120px;
        border-bottom: 1px solid #232a31;
      }
      .admin-chart-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; min-width: 0; }
      .admin-chart-value { font-size: 9px; color: #9aa4af; }
      .admin-chart-bar { width: 70%; background: #0b60d6; border-radius: 2px 2px 0 0; min-height: 1px; }
      .admin-chart-date { font-size: 8px; color: #7d8894; margin-top: 2px; white-space: nowrap; transform: rotate(-45deg); transform-origin: top left; }
      .admin-map {
        position: relative; background: #0c1013; border-radius: 6px; margin: 6px 0;
        aspect-ratio: 2 / 1; overflow: hidden;
      }
      .admin-map-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill; opacity: 0.9; }
      .admin-map-svg { position: absolute; inset: 0; width: 100%; height: 100%; }
      .admin-map-dot { fill: rgba(11,96,214,0.55); stroke: #4aa3df; stroke-width: 0.5; }
      .admin-map-num { fill: #fff; font-size: 8px; text-anchor: middle; dominant-baseline: middle; pointer-events: none; }
      .admin-stats { display: flex; flex-direction: column; gap: 4px; }
      .admin-stat-row { display: flex; align-items: center; gap: 8px; font-size: 12px; }
      .admin-stat-label { flex: 0 0 40%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .admin-stat-bar { flex: 1; height: 8px; background: #232a31; border-radius: 4px; overflow: hidden; }
      .admin-stat-fill { display: block; height: 100%; background: #0b60d6; }
      .admin-stat-count { flex: none; font-variant-numeric: tabular-nums; color: #cfe6ff; }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div id="hud"><div class="hud-status connecting">● Connecting…</div></div>
    <div id="controls">
      <button id="hotspots-toggle" class="ctl-btn" title="Show delay hotspots">Hotspots: Off</button>
      <button id="trackrecords-toggle" class="ctl-btn" title="Show reliability track records">Track Records: Off</button>
      <button id="ferries-toggle" class="ctl-btn" title="Show NYC Ferry boats">Ferries: On</button>
      <button id="planner-toggle" class="ctl-btn" title="Plan a trip">Trip Planner: Off</button>
      <div id="bus-group">
        <div class="bg-title">Buses</div>
        <button class="bus-boro active" data-boro="manhattan">Manhattan</button>
        <button class="bus-boro active" data-boro="brooklyn">Brooklyn</button>
        <button class="bus-boro" data-boro="bronx">Bronx</button>
        <button class="bus-boro" data-boro="queens">Queens</button>
        <button class="bus-boro" data-boro="statenisland">Staten Island</button>
        <div class="bus-zoom">
          <label>Show buses at zoom ≥ <span id="bus-zoom-val">13.5</span></label>
          <input id="bus-zoom" type="range" min="11" max="16" step="0.5" value="13.5" />
        </div>
      </div>
    </div>
    <div id="tr-modal">
      <div class="tr-card">
        <h3>Collecting data…</h3>
        <div class="tr-prog"></div>
        <div class="tr-bar"><span></span></div>
        <div class="tr-break"></div>
        <button class="tr-close" type="button">Got it</button>
      </div>
    </div>
    <div id="admin-overlay">
      <div class="admin-card">
        <div class="admin-head">
          <h2>Admin</h2>
          <button id="admin-close" class="admin-close" type="button">✕</button>
        </div>
        <div id="admin-gate" class="admin-gate">
          <form id="admin-auth-form" class="admin-auth-form">
            <label for="admin-password">Password</label>
            <input type="password" id="admin-password" autocomplete="off" required />
            <div id="admin-auth-error" class="admin-auth-error"></div>
            <button type="submit">Enter</button>
          </form>
        </div>
        <div id="admin-content" class="admin-content hidden">
          <div class="admin-total" id="admin-total"></div>
          <div class="admin-section-title">Visits over time</div>
          <div class="admin-chart" id="admin-chart"></div>
          <div class="admin-section-title">Visits by location</div>
          <div class="admin-total" id="admin-ip-total"></div>
          <div class="admin-map" id="admin-map">
            <img class="admin-map-img" src="/assets/world.svg" alt="World map" />
            <svg class="admin-map-svg" id="admin-map-svg" viewBox="0 0 720 360" preserveAspectRatio="none"></svg>
          </div>
          <div class="admin-stats" id="admin-locations"></div>
        </div>
      </div>
    </div>
    <div id="legend"><h4>Subway Lines</h4><div class="rows"></div></div>
    <div id="disclaimer">
      Live data from the
      <a href="https://api.mta.info/" target="_blank" rel="noopener">MTA GTFS-realtime feed</a>.
      Positions are estimated and may be inaccurate; see
      <a href="https://www.mta.info" target="_blank" rel="noopener">mta.info</a> for official service info.
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
